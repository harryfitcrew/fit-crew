<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit Crew</title>
<meta name="description" content="Fitness accountability for a small group of mates: food, workouts, weight and a leaderboard.">
<meta name="theme-color" content="#1f1e1d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1f1e1d; --surface:#262624; --card:#2d2c2a; --card2:#353431; --line:#3d3c38;
  --text:#f5f4ef; --muted:#a8a59c; --faint:#77746c;
  --accent:#d97757; --accent-2:#e8a07f; --accent-ink:#1f1e1d;
  --good:#7cbf86; --good-bg:rgba(124,191,134,.13);
  --bad:#ef6a5e; --bad-bg:rgba(239,106,94,.14);
  --warn:#e3b25b; --warn-bg:rgba(227,178,91,.13);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --hdr:104px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

/* Header + tabs */
header.top{position:fixed;inset:0 0 auto 0;z-index:20;background:linear-gradient(var(--bg) 82%,rgba(31,30,29,0));padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.brand{display:flex;align-items:center;gap:10px;height:40px}
.brand h1{font:600 22px/1 var(--serif);margin:0;flex:1}
.brand h1 b{color:var(--accent);font-weight:600}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:none;border:0;padding:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync.busy i{background:var(--warn);animation:pulse 1s infinite}
.sync.err i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.tabs{display:flex;gap:4px;margin:8px 0 6px;background:var(--surface);border-radius:999px;padding:4px;position:relative}
.tabs button{flex:1;border:0;background:none;padding:8px 0;border-radius:999px;font-weight:600;color:var(--muted);position:relative;z-index:1;transition:color .2s}
.tabs button.on{color:var(--accent-ink)}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 6px);border-radius:999px;background:var(--accent);transition:transform .25s ease}

/* Pager */
#pager{position:fixed;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
#pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;height:100%;overflow-y:auto;scroll-snap-align:start;padding:calc(var(--hdr) + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.wrap{max-width:720px;margin:0 auto}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.card h2{font:600 18px/1.2 var(--serif);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 small{font:500 12px var(--sans);color:var(--muted);margin-left:auto}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 10px}
.sect h2{font:600 20px/1.2 var(--serif);margin:0}
.sect span{font-size:13px;color:var(--muted)}

/* Leaderboard tiles */
.chips{display:flex;gap:8px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--card2);color:var(--text);border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
.tile.lead{grid-column:1/-1}
.tile.good{border-color:rgba(124,191,134,.45)}
.tile.bad{border-color:rgba(239,106,94,.55);background:linear-gradient(180deg,var(--bad-bg),var(--card) 60%)}
.tile.good::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(124,191,134,.18) 45%,rgba(232,160,127,.22) 50%,transparent 65%);background-size:250% 100%;animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-120% 0}}
.tile .who{display:flex;align-items:center;gap:8px;min-width:0}
.av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--sans);color:#1f1e1d}
.av.lg{width:48px;height:48px;font-size:20px}
.who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank{margin-left:auto;font:600 13px var(--serif);color:var(--muted);display:flex;align-items:center;gap:3px}
.rank.r1{color:var(--warn)}
.tag{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.tmain{display:flex;align-items:center;gap:10px}
.tnums{min-width:0}
.tnums .eat{font-size:22px;line-height:1.1}
.tnums .eat small,.tnums .brn small{font:500 11px var(--sans);color:var(--muted);margin-left:3px}
.tnums .brn{font-size:15px;color:var(--accent-2)}
.tmsg{font-size:12.5px;font-weight:500;line-height:1.3}
.tfoot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:auto}
.tfoot .metric{color:var(--text);font-weight:600}
.kudo{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 8px;font-size:12px;display:flex;align-items:center;gap:4px;color:var(--muted)}
.kudo.on{border-color:var(--accent);color:var(--accent-2)}
.flame{color:var(--accent)}
.me-dot{font-size:10px;color:var(--accent-2);font-weight:600;margin-left:4px}

/* Week grid */
.wk{width:100%;border-collapse:collapse;font-size:13px}
.wk th{font-weight:500;color:var(--muted);padding:4px 0;font-size:12px}
.wk td{text-align:center;padding:5px 0}
.wk td:first-child,.wk th:first-child{text-align:left;width:34%}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--card2);border:2px solid transparent;vertical-align:middle}
.dot.good{background:var(--good)} .dot.bad{background:var(--bad)} .dot.pending{background:var(--warn)} .dot.missed{background:transparent;border-color:var(--line)}
.dot.ex{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend .dot{width:11px;height:11px;border-width:1.5px}

/* Charts */
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--sans)}
.keyrow{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.keyrow span{display:flex;align-items:center;gap:5px}
.keyrow i{width:10px;height:3px;border-radius:2px}

/* Me page */
.datebar{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 0 12px}
.datebar b{font:600 17px var(--serif);min-width:140px;text-align:center}
.icon{border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.icon:disabled{opacity:.3}
.icon svg,.btn svg,.kudo svg,.rank svg,.sync svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kudo svg{width:14px;height:14px}
.summary{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.big{display:flex;flex-direction:column;gap:2px}
.big .lbl{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.big .eat{font-size:34px;line-height:1.05}
.big .brn{font-size:22px;color:var(--accent-2);line-height:1.1}
.big .unit{font:500 13px var(--sans);color:var(--muted);margin-left:4px}
.status{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:500;font-size:14px}
.status.good{background:var(--good-bg)} .status.bad{background:var(--bad-bg)} .status.pending,.status.none{background:var(--warn-bg);color:var(--warn)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.macro{background:var(--surface);border-radius:12px;padding:8px 10px}
.macro b{display:block;font:600 17px var(--serif)}
.macro span{font-size:11px;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:9px 10px 9px 12px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:12px}
.row .k{font:600 15px var(--serif)}
.x{border:0;background:none;color:var(--faint);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:18px;line-height:1}
.empty{color:var(--muted);font-size:13px;padding:4px 2px 10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;color:var(--text);outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn.danger{color:var(--bad);border-color:rgba(239,106,94,.4);background:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 0;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:0}
.est{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent)}
.est .a{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.est .a small{display:block;color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border-radius:12px;padding:10px}
.stat span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:500}
.stat b{font:600 19px var(--serif)}
.diary{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.diary .t{flex:1}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.toggle input{width:auto;accent-color:var(--accent)}

/* Sheet (profile + gate) */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(10,10,9,.6);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex;animation:fade .2s}
#sheet .panel{width:100%;max-width:720px;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 16px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.phead h2{font:600 24px/1.1 var(--serif);margin:0}
.phead .x{margin-left:auto;background:var(--surface);width:36px;height:36px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:calc(28px + env(safe-area-inset-top)) 16px 40px;display:none}
#gate.open{display:block}
#gate h1{font:600 32px/1.1 var(--serif);margin:8px 0 6px}
#gate h1 b{color:var(--accent)}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;pointer-events:none}
#toast div{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:up .2s}
/* Barcode scanning */
.scanbtn{margin-bottom:12px}
.scanned{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.scanned .sh{display:flex;align-items:flex-start;gap:8px}
.scanned .t{flex:1;display:flex;flex-direction:column;gap:2px}
.scanned small{color:var(--muted);font-size:12px}
.scanned .qa{display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.scanned .qa .btn{padding:6px 10px;font-size:13px}
#scan{position:fixed;inset:0;z-index:65;background:#000;display:flex;flex-direction:column}
#scan .scan-cam{position:relative;flex:1;overflow:hidden}
#scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scan .scan-frame{position:absolute;left:10%;right:10%;top:50%;height:28%;transform:translateY(-50%);border:3px solid var(--accent);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
#scan .scan-panel{background:var(--bg);padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#scan .scan-msg{margin:0;font-weight:600;text-align:center}
#scan .scan-type{display:flex;gap:8px}
#scan .scan-type input{flex:1;min-width:0}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}
@media (min-width:620px){.tiles{grid-template-columns:repeat(3,1fr)}.tile.lead{grid-column:span 3}}
@media (max-width:350px){.tiles{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Fit <b>Crew</b></h1>
    <button class="sync" id="sync" aria-label="Sync now"><i></i><span>Synced</span></button>
  </div>
  <nav class="tabs" role="tablist">
    <span class="pill" id="pill"></span>
    <button class="on" data-tab="0" role="tab">Crew</button>
    <button data-tab="1" role="tab">Me</button>
  </nav>
</header>
<main id="pager">
  <section class="page" id="pCrew"><div class="wrap" id="crew"></div></section>
  <section class="page" id="pMe"><div class="wrap" id="me"></div></section>
</main>
<div id="sheet" role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>
<div id="gate"></div>
<div id="toast" aria-live="polite"></div>
<canvas id="confetti"></canvas>
<script src="config.js"></script>
<script src="logic.js"></script>
<script src="scan.js"></script>
<script src="app.js"></script>
</body>
</html>
